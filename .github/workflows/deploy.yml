name: Deploy EC2

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify current main and successful CI
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          repository=$GITHUB_REPOSITORY
          main_sha=$(gh api "repos/$repository/git/ref/heads/main" --jq '.object.sha')
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid main SHA.' >&2; exit 1; }
          ci_id=$(gh api "repos/$repository/actions/workflows/ci.yml" --jq '.id')
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            run_id=$(jq -r '.workflow_run.id' "$GITHUB_EVENT_PATH")
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'Invalid CI run ID.' >&2; exit 1; }
            run=$(gh api "repos/$repository/actions/runs/$run_id")
            jq -e --arg sha "$main_sha" --arg repo "$repository" --argjson ci "$ci_id" '
              .workflow_id == $ci and .path == ".github/workflows/ci.yml" and
              .status == "completed" and .conclusion == "success" and
              .event == "push" and .head_branch == "main" and .head_sha == $sha and
              .repository.full_name == $repo and .head_repository.full_name == $repo
            ' <<< "$run" >/dev/null || { echo 'CI must be a successful push run for current main in this repository.' >&2; exit 1; }
            event_sha=$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")
            [[ "$event_sha" == "$main_sha" ]] || { echo 'Trigger SHA is no longer current main.' >&2; exit 1; }
          else
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Manual deployment requires main.' >&2; exit 1; }
            # A manual dispatch may select only current main, and cannot bypass CI.
            runs=$(gh api --method GET "repos/$repository/actions/workflows/ci.yml/runs" \
              -f branch=main -f event=push -f status=success -f head_sha="$main_sha" -f per_page=100)
            jq -e --arg sha "$main_sha" --arg repo "$repository" --argjson ci "$ci_id" '
              any(.workflow_runs[];
                .workflow_id == $ci and .path == ".github/workflows/ci.yml" and
                .status == "completed" and .conclusion == "success" and
                .event == "push" and .head_branch == "main" and .head_sha == $sha and
                .repository.full_name == $repo and .head_repository.full_name == $repo)
            ' <<< "$runs" >/dev/null || { echo 'Current main has no successful CI push run.' >&2; exit 1; }
          fi
          printf 'sha=%s\n' "$main_sha" >> "$GITHUB_OUTPUT"

      - name: Check out verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.verified.outputs.sha }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            altercharger-server/*.gradle
            altercharger-server/gradle/wrapper/gradle-wrapper.properties

      - name: Build verified JAR
        working-directory: altercharger-server
        env:
          SPRING_PROFILES_ACTIVE: ci
          DATA_GO_KR_ENABLED: "false"
        run: ./gradlew bootJar --no-daemon -x test

      - name: Stage deployment files
        env:
          DEPLOY_SHA: ${{ steps.verified.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bundle="$RUNNER_TEMP/altercharge-bundle/$DEPLOY_SHA"
          mkdir -p "$bundle/scripts/lib" "$bundle/docker/postgres"
          mapfile -t jars < <(find altercharger-server/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar')
          [[ ${#jars[@]} == 1 ]] || { echo 'Expected exactly one executable JAR.' >&2; exit 1; }
          cp -- "${jars[0]}" "$bundle/app.jar"
          cp -- Dockerfile.runtime compose.prod.yaml Caddyfile.prod .dockerignore "$bundle/"
          cp -- docker/postgres/10-create-app-user.sh "$bundle/docker/postgres/"
          cp -- scripts/deploy-ec2.sh "$bundle/scripts/"
          cp -- scripts/lib/env.py "$bundle/scripts/lib/"
          # No .env, application credentials, SSH keys, or user dumps enter the bundle.

      - name: Transfer and deploy verified release
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.verified.outputs.sha }}
          EC2_HOST: ${{ secrets.EC2_HOST || vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$EC2_HOST" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ && "$EC2_HOST" != needed ]] \
            || { echo 'Set EC2_HOST to the verified EC2 DNS name or IPv4 address.' >&2; exit 1; }
          [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ && "$EC2_USER" != needed ]] \
            || { echo 'Set EC2_USER to a valid SSH account.' >&2; exit 1; }
          [[ -n "$EC2_SSH_PRIVATE_KEY" && "$EC2_SSH_PRIVATE_KEY" != needed &&
             -n "$EC2_SSH_KNOWN_HOSTS" && "$EC2_SSH_KNOWN_HOSTS" != needed ]] \
            || { echo 'Configure the SSH private key and independently verified known_hosts secrets.' >&2; exit 1; }
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$DEPLOY_SHA" ]] \
            || { echo 'Main changed during the build; deployment stopped.' >&2; exit 1; }

          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/altercharge-ssh.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/id"
          printf '%s\n' "$EC2_SSH_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id" "$ssh_dir/known_hosts"
          ssh-keygen -y -f "$ssh_dir/id" >/dev/null 2>&1 \
            || { echo 'The deployment SSH key is invalid or requires a passphrase.' >&2; exit 1; }
          ssh-keygen -F "$EC2_HOST" -f "$ssh_dir/known_hosts" >/dev/null \
            || { echo 'known_hosts does not contain the configured EC2 host.' >&2; exit 1; }

          destination="$EC2_USER@$EC2_HOST"
          remote="/opt/altercharge/staging/$DEPLOY_SHA"
          ssh_options=(-F /dev/null -i "$ssh_dir/id" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          # rsync's SSH command is a fixed script; key paths are quoted inside it.
          export ALTERCHARGE_SSH_DIR="$ssh_dir"
          cat > "$ssh_dir/transport" <<'SSH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exec ssh -F /dev/null -i "$ALTERCHARGE_SSH_DIR/id" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ALTERCHARGE_SSH_DIR/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 "$@"
          SSH
          chmod 700 "$ssh_dir/transport"
          ssh "${ssh_options[@]}" "$destination" "mkdir -p -- '$remote'"
          rsync -r --chmod=D755,F644 --rsh="$ssh_dir/transport" \
            "$RUNNER_TEMP/altercharge-bundle/$DEPLOY_SHA/" "$destination:$remote/"
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$DEPLOY_SHA" ]] \
            || { echo 'Main changed before activation; staged release was not deployed.' >&2; exit 1; }
          ssh "${ssh_options[@]}" "$destination" "chmod 700 '$remote/scripts/deploy-ec2.sh' && bash '$remote/scripts/deploy-ec2.sh' '$DEPLOY_SHA'"
