spring:
  application:
    name: altercharger-server
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_ADOPT_LEGACY_SCHEMA}
    baseline-version: "0"
    clean-disabled: true

server:
  port: ${APP_PORT}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  stations:
    status-max-age-minutes: ${STATION_STATUS_MAX_AGE_MINUTES}
  history:
    retention-days: ${HISTORY_RETENTION_DAYS}
    max-future-minutes: ${HISTORY_MAX_FUTURE_MINUTES}
  collector:
    enabled: ${DATA_GO_KR_ENABLED}
    service-key: ${DATA_GO_KR_SERVICE_KEY}
    base-url: ${DATA_GO_KR_BASE_URL}
    data-type: ${DATA_GO_KR_DATA_TYPE}
    status-refresh-seconds: ${DATA_GO_KR_STATUS_REFRESH_SECONDS}
    info-refresh-seconds: ${DATA_GO_KR_INFO_REFRESH_SECONDS}
    zcodes: ${DATA_GO_KR_ZCODES}
    rows: ${DATA_GO_KR_NUM_OF_ROWS}
    daily-budget: ${DATA_GO_KR_DAILY_BUDGET}
    metadata-budget: ${DATA_GO_KR_METADATA_BUDGET}

springdoc:
  paths-to-match: /api/v1/**
  override-with-generic-response: false

logging:
  level:
    # HTTP 클라이언트의 요청 URL에는 인증키가 포함된다.
    jdk.httpclient.HttpClient: "OFF"
